# SPDX-License-Identifier: Apache-2.0
[package]
name = "scf-editor"
version = "0.1.0"
description = "The SCF editor as a desktop app"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "scf_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
base64 = "0.23.1"
tokio = { version = "1.53.3", features = ["net", "rt", "macros"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
dunce = "1.0.5"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }

[features]
# The in-app host spike's harness (src/spike.rs) in a release build.
spike = []

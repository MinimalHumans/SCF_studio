# SPDX-License-Identifier: Apache-2.0
[package]
name = "scf-editor"
version = "0.1.0"
description = "The SCF editor as a desktop app"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "scf_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

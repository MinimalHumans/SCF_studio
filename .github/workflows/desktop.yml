# SPDX-License-Identifier: Apache-2.0
# The desktop app, built for Windows and Linux.
#
# Separate from ci.yml because it publishes: every push to `main` or
# `tauri` replaces one rolling prerelease, `desktop-latest`. Windows
# gives the signed NSIS installer and a zip holding that installer plus
# a portable copy (the app, which is its own MCP pipe, uninstalled);
# Linux gives an AppImage and a .deb, unsigned, so the release carries
# a SHA256SUMS. The same files are also kept as workflow artifacts for
# each run.
#
# Pushing a tag `editor-X.Y.Z` makes a real release instead: the tag
# must sit on `main` and match scf-app/package.json, and the release
# stays put, with the spec and schema tags the build descends from in
# its notes. The rolling prerelease is left alone.

name: Desktop

on:
  push:
    branches: [main, tauri]
    tags: ["editor-*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

# A newer push makes an older build pointless.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  RELEASE_TAG: desktop-latest
  # Builds that sign and publish: the two branches and release tags.
  PUBLISH: ${{ github.ref_type == 'tag' || contains(fromJSON('["refs/heads/main", "refs/heads/tauri"]'), github.ref) }}
  # Artifact Signing, reached by OIDC as the app registration whose
  # federated credential trusts `main`, `tauri` and the `editor-*` tags
  # (none of these are secrets).
  AZURE_CLIENT_ID: cea87653-01f1-4308-9988-8ca28c971a70
  AZURE_TENANT_ID: dbbfdd81-727c-4a58-a3f5-db66a2d489c1
  AZURE_SUBSCRIPTION_ID: e3fd192a-87a3-4645-aa51-6744c2be6469
  SIGNING_ENDPOINT: https://eus.codesigning.azure.net
  SIGNING_ACCOUNT: krets-signing
  SIGNING_PROFILE: scf-public-trust

jobs:
  # A tag must match the app's version and sit on main, before any
  # build time is spent. Runs on every push so the builds can depend on
  # it unconditionally.
  check:
    name: Check the release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: tag matches package.json and is on main
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./scf-app/package.json').version")
          if [ "$GITHUB_REF_NAME" != "editor-$version" ]; then
            echo "::error::$GITHUB_REF_NAME does not match scf-app/package.json ($version)"
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi

  windows:
    name: Windows installer and portable zip
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            scf-core/package-lock.json
            scf-host/package-lock.json
            scf-mcp/package-lock.json
            scf-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scf-app/src-tauri

      # The window bundles scf-host and scf-mcp from source, and those
      # depend on scf-core by file path, so all four need dependencies;
      # core and host are built as in ci.yml's mcp job.
      - run: npm ci
        working-directory: scf-core

      - run: npm run build
        working-directory: scf-core

      - run: npm ci
        working-directory: scf-host

      - run: npm run build
        working-directory: scf-host

      - run: npm ci
        working-directory: scf-mcp

      - run: npm ci
        working-directory: scf-app

      - name: azure login
        if: env.PUBLISH == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      # signtool plus Microsoft's Artifact Signing dlib, which takes its
      # credential from the azure/login session above (no client secret).
      - name: set up signtool
        if: env.PUBLISH == 'true'
        shell: pwsh
        run: |
          nuget install Microsoft.Trusted.Signing.Client -Version 1.0.60 -x -OutputDirectory "$env:RUNNER_TEMP/signing"
          $dlib = (Resolve-Path "$env:RUNNER_TEMP/signing/Microsoft.Trusted.Signing.Client/bin/x64/Azure.CodeSigning.Dlib.dll").Path
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/10.*/x64/signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1).FullName
          $metadata = "$env:RUNNER_TEMP/signing/metadata.json"
          @{
            Endpoint               = $env:SIGNING_ENDPOINT
            CodeSigningAccountName = $env:SIGNING_ACCOUNT
            CertificateProfileName = $env:SIGNING_PROFILE
          } | ConvertTo-Json | Set-Content $metadata

          # tauri splits signCommand on spaces, so it calls a script
          # that reads these from the environment.
          'if (-not $args[0]) { throw "no file to sign" }',
          '& $env:SIGNTOOL sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib $env:SIGNING_DLIB /dmdf $env:SIGNING_METADATA $args[0]',
          'if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }' | Set-Content "$env:RUNNER_TEMP/signing/sign.ps1"

          "SIGNTOOL=$signtool" >> $env:GITHUB_ENV
          "SIGNING_DLIB=$dlib" >> $env:GITHUB_ENV
          "SIGNING_METADATA=$metadata" >> $env:GITHUB_ENV

      # beforeBuildCommand builds the page first. With signCommand set,
      # tauri signs the exe it puts in the installer, then the installer.
      - name: tauri build
        shell: pwsh
        run: |
          if ($env:PUBLISH -eq "true") {
            $cmd = "pwsh -NoProfile -File $env:RUNNER_TEMP/signing/sign.ps1 %1"
            $config = @{ bundle = @{ windows = @{ signCommand = $cmd } } } | ConvertTo-Json -Compress -Depth 5
            npm run tauri build -- --config $config
          } else {
            npm run tauri build
          }
        working-directory: scf-app

      # tauri restores the unpatched exe after bundling, which drops the
      # signature it put on the copy inside the installer. The portable
      # copy is made from this one, so sign it again.
      - name: sign the portable exe
        if: env.PUBLISH == 'true'
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/signing/sign.ps1" "$PWD/scf-app/src-tauri/target/release/scf-editor.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: verify signatures
        if: env.PUBLISH == 'true'
        shell: pwsh
        run: |
          $release = "scf-app/src-tauri/target/release"
          foreach ($file in "$release/scf-editor.exe", (Get-ChildItem "$release/bundle/nsis/*-setup.exe").FullName) {
            $sig = Get-AuthenticodeSignature $file
            "$file : $($sig.Status)"
            if ($sig.Status -ne "Valid") { throw "$file is not validly signed" }
          }

      - name: package
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content scf-app/package.json | ConvertFrom-Json).version
          $sha = "${{ github.sha }}".Substring(0, 7)
          $name = "SCF-Editor-$version-win-x64-$sha"
          $release = "scf-app/src-tauri/target/release"
          $setup = Get-ChildItem "$release/bundle/nsis/*-setup.exe" | Select-Object -First 1

          # The licences go at the top and in portable/, where the
          # installer would have put them (tauri.conf.json resources).
          foreach ($dir in "out/$name", "out/$name/portable") {
            New-Item -ItemType Directory -Force $dir | Out-Null
            Copy-Item LICENSE, NOTICE $dir
          }
          Copy-Item $setup.FullName "out/$name/"
          Copy-Item "$release/scf-editor.exe" "out/$name/portable/"
          Compress-Archive -Path "out/$name/*" -DestinationPath "out/$name.zip"

          # Release assets cannot carry spaces in their names.
          Copy-Item $setup.FullName "out/SCF-Editor-$version-x64-setup.exe"

          "name=$name" >> $env:GITHUB_OUTPUT
          "setup=out/SCF-Editor-$version-x64-setup.exe" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: out/${{ steps.package.outputs.name }}/

      # What the release job publishes.
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            out/${{ steps.package.outputs.name }}.zip
            ${{ steps.package.outputs.setup }}

  linux:
    name: Linux AppImage and deb
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            scf-core/package-lock.json
            scf-host/package-lock.json
            scf-mcp/package-lock.json
            scf-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scf-app/src-tauri

      # Built on 22.04, not latest: an AppImage runs only where its
      # glibc is at least as new as the one it was built against.
      - name: system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev patchelf

      - run: npm ci
        working-directory: scf-core

      - run: npm run build
        working-directory: scf-core

      - run: npm ci
        working-directory: scf-host

      - run: npm run build
        working-directory: scf-host

      - run: npm ci
        working-directory: scf-mcp

      - run: npm ci
        working-directory: scf-app

      # tauri.conf.json lists only the Windows installer, which a Linux
      # build cannot make; the formats are named here instead.
      - name: tauri build
        run: npm run tauri build -- --bundles appimage deb
        working-directory: scf-app

      - name: package
        id: package
        run: |
          version=$(node -p "require('./scf-app/package.json').version")
          bundle=scf-app/src-tauri/target/release/bundle
          mkdir -p out
          cp "$bundle"/appimage/*.AppImage "out/SCF-Editor-$version-x86_64.AppImage"
          cp "$bundle"/deb/*.deb "out/SCF-Editor-$version-amd64.deb"
          chmod +x "out/SCF-Editor-$version-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: out/*

  # One release from both builds. Delete and recreate the rolling one
  # rather than edit it, so its tag moves to this commit and the old
  # assets go with it; a tagged release is created once and never
  # replaced.
  release:
    name: Publish the release
    needs: [windows, linux]
    if: github.ref_type == 'tag' || contains(fromJSON('["refs/heads/main", "refs/heads/tauri"]'), github.ref)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: replace the desktop-latest prerelease
        if: github.ref_type == 'branch'
        run: |
          gh release delete "$RELEASE_TAG" --cleanup-tag --yes || true
          gh release create "$RELEASE_TAG" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Desktop (latest ${GITHUB_REF_NAME} build)" \
            --notes "Windows (signed) and Linux (unsigned; see SHA256SUMS) builds of ${GITHUB_SHA::7} on \`${GITHUB_REF_NAME}\`. Replaced on every push; not a release." \
            dist/*

      # A version with a hyphen (0.2.0-rc.1) is marked a prerelease.
      - name: publish the release
        if: github.ref_type == 'tag'
        run: |
          version=${GITHUB_REF_NAME#editor-}
          spec=$(git describe --tags --abbrev=0 --match 'spec-*' "$GITHUB_SHA" || echo none)
          schema=$(git describe --tags --abbrev=0 --match 'schema-*' "$GITHUB_SHA" || echo none)
          pre=()
          case "$version" in *-*) pre=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" \
            "${pre[@]}" \
            --verify-tag \
            --title "SCF Editor $version" \
            --notes "Windows (signed) and Linux (unsigned; see SHA256SUMS) builds of ${GITHUB_SHA::7}. Built against \`$spec\` and \`$schema\`." \
            dist/*

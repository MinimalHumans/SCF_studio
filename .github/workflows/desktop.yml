# SPDX-License-Identifier: Apache-2.0
# The desktop app, built for Windows.
#
# Separate from ci.yml because it publishes: every push to `tauri`
# replaces one rolling prerelease, `desktop-latest`, with the NSIS
# installer and a zip holding that installer plus a portable copy (the
# app, which is its own MCP pipe, uninstalled). The same
# files are also kept as a workflow artifact for each run.
#
# `in-app-host` builds the same way but publishes nothing: its installer
# is only the run's artifact, so `desktop-latest` stays `tauri`'s.
# Release tags come later.

name: Desktop

on:
  push:
    branches: [tauri, in-app-host]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

# A newer push makes an older build pointless.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  RELEASE_TAG: desktop-latest
  # Artifact Signing, reached by OIDC as the app registration whose
  # federated credential trusts `tauri` (none of these are secrets).
  # Only `tauri` signs; `in-app-host` builds unsigned.
  AZURE_CLIENT_ID: cea87653-01f1-4308-9988-8ca28c971a70
  AZURE_TENANT_ID: dbbfdd81-727c-4a58-a3f5-db66a2d489c1
  AZURE_SUBSCRIPTION_ID: e3fd192a-87a3-4645-aa51-6744c2be6469
  SIGNING_ENDPOINT: https://eus.codesigning.azure.net
  SIGNING_ACCOUNT: krets-signing
  SIGNING_PROFILE: scf-public-trust

jobs:
  windows:
    name: Windows installer and portable zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            scf-core/package-lock.json
            scf-host/package-lock.json
            scf-mcp/package-lock.json
            scf-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scf-app/src-tauri

      # The window bundles scf-host and scf-mcp from source, and those
      # depend on scf-core by file path, so all four need dependencies;
      # core and host are built as in ci.yml's mcp job.
      - run: npm ci
        working-directory: scf-core

      - run: npm run build
        working-directory: scf-core

      - run: npm ci
        working-directory: scf-host

      - run: npm run build
        working-directory: scf-host

      - run: npm ci
        working-directory: scf-mcp

      - run: npm ci
        working-directory: scf-app

      - name: azure login
        if: github.ref == 'refs/heads/tauri'
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: install trusted-signing-cli
        if: github.ref == 'refs/heads/tauri'
        run: cargo install trusted-signing-cli --locked

      # beforeBuildCommand builds the page first. With signCommand set,
      # tauri signs scf-editor.exe before bundling it, then the
      # installer, so the portable copy packaged below is signed too.
      - name: tauri build
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -eq "refs/heads/tauri") {
            $cmd = "trusted-signing-cli -e $env:SIGNING_ENDPOINT -a $env:SIGNING_ACCOUNT -c $env:SIGNING_PROFILE -d `"SCF Editor`" %1"
            $config = @{ bundle = @{ windows = @{ signCommand = $cmd } } } | ConvertTo-Json -Compress -Depth 5
            npm run tauri build -- --config $config
          } else {
            npm run tauri build
          }
        working-directory: scf-app

      - name: verify signatures
        if: github.ref == 'refs/heads/tauri'
        shell: pwsh
        run: |
          $release = "scf-app/src-tauri/target/release"
          foreach ($file in "$release/scf-editor.exe", (Get-ChildItem "$release/bundle/nsis/*-setup.exe").FullName) {
            $sig = Get-AuthenticodeSignature $file
            "$file : $($sig.Status)"
            if ($sig.Status -ne "Valid") { throw "$file is not validly signed" }
          }

      - name: package
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content scf-app/package.json | ConvertFrom-Json).version
          $sha = "${{ github.sha }}".Substring(0, 7)
          $name = "SCF-Editor-$version-win-x64-$sha"
          $release = "scf-app/src-tauri/target/release"
          $setup = Get-ChildItem "$release/bundle/nsis/*-setup.exe" | Select-Object -First 1

          # The licences go at the top and in portable/, where the
          # installer would have put them (tauri.conf.json resources).
          foreach ($dir in "out/$name", "out/$name/portable") {
            New-Item -ItemType Directory -Force $dir | Out-Null
            Copy-Item LICENSE, NOTICE $dir
          }
          Copy-Item $setup.FullName "out/$name/"
          Copy-Item "$release/scf-editor.exe" "out/$name/portable/"
          Compress-Archive -Path "out/$name/*" -DestinationPath "out/$name.zip"

          # Release assets cannot carry spaces in their names.
          Copy-Item $setup.FullName "out/SCF-Editor-$version-x64-setup.exe"

          "name=$name" >> $env:GITHUB_OUTPUT
          "setup=out/SCF-Editor-$version-x64-setup.exe" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: out/${{ steps.package.outputs.name }}/

      # Delete and recreate rather than edit, so the tag moves to this
      # commit and the old assets go with it.
      - name: replace the desktop-latest prerelease
        if: github.ref == 'refs/heads/tauri'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$RELEASE_TAG" --cleanup-tag --yes || true
          gh release create "$RELEASE_TAG" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Desktop (latest ${GITHUB_REF_NAME} build)" \
            --notes "Signed Windows build of ${GITHUB_SHA::7} on \`${GITHUB_REF_NAME}\`. Replaced on every push; not a release." \
            "out/${{ steps.package.outputs.name }}.zip" \
            "${{ steps.package.outputs.setup }}"

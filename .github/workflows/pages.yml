# The documentation site.
#
# Separate from ci.yml on purpose. CI verifies the repository and must
# never write to it; this publishes, and publishing on a pull request
# from a fork would be a way to put anything on the project's domain.
# So: main only, and the build itself is ALSO run by ci.yml in --check
# mode, where a broken cross-reference fails the pull request before it
# is merged rather than after.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One at a time, and never cancel a deploy midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund
        working-directory: site

      - name: Build the site
        run: npm run build
        working-directory: site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
